<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ethan Kessinger</title>
<meta name="description" content="Ethan Kessinger builds AI-native products for the people who hire people. This site holds one open question at a time, and why it’s worth asking.">
<link rel="canonical" href="https://www.ethankessinger.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.ethankessinger.com/">
<meta property="og:title" content="Ethan Kessinger">
<meta property="og:description" content="Ethan Kessinger builds AI-native products for the people who hire people. This site holds one open question at a time, and why it’s worth asking.">
<meta property="og:image" content="https://www.ethankessinger.com/og-image.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F4F0E6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Instrument+Serif:ital@0;1&family=VT323&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="content.js" defer></script>
<script src="app.js" defer></script>
</head>
<body class="page-home look-editorial">

<a class="about-link pill" id="about-link" href="#" hidden>About</a>

<main id="stage" class="stage">
  <p class="prompt" aria-hidden="true">ethan@brooklyn:~$ cat question.txt</p>
  <h1 class="question" id="question">
    <span class="sr-only" id="q-full"></span>
    <span class="q-visual" aria-hidden="true"><span class="q-pre"></span><span class="q-em"></span><span class="q-post"></span><span class="cursor"></span></span>
  </h1>
  <noscript><p class="noscript">This page needs JavaScript to show the question.</p></noscript>
</main>

<section id="why" class="why" aria-labelledby="why-title" hidden>
  <article class="why-inner">
    <p class="kicker">Why this question</p>
    <h2 class="why-q" id="why-title"></h2>
    <div class="why-body" id="why-body"></div>
    <p class="why-close"><span id="why-closing"></span> <a id="why-answer" hidden></a></p>
  </article>
</section>

<footer class="bar">
  <span class="bar-name">Ethan Kessinger</span>
  <div class="toggle" id="toggle" role="group" aria-label="View" hidden>
    <button type="button" id="btn-q" aria-pressed="true">The question</button>
    <button type="button" id="btn-why" aria-pressed="false">Why it matters</button>
  </div>
  <button type="button" id="btn-past" class="bar-past" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
    <span>Past questions</span>
  </button>
</footer>

<div id="tm" class="tm" role="dialog" aria-modal="true" aria-label="Past questions" hidden>
  <div class="stars" aria-hidden="true"></div>
  <p class="tm-title">Every question I’ve asked here</p>
  <nav class="tm-timeline" id="tm-timeline" aria-label="Questions"></nav>
  <div class="tm-stack" id="tm-stack"></div>
  <div class="tm-controls">
    <button type="button" class="round" id="tm-older" aria-label="Older question">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <button type="button" class="back" id="tm-close">Back to now</button>
    <button type="button" class="round" id="tm-newer" aria-label="Newer question">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
</div>

</body>
</html>
